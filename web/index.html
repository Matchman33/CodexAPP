<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CodexApp" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-180.png" />
  <link rel="stylesheet" href="style.css" />
  <title>CodexApp</title>
</head>
<body>
  <!-- Setup gate -->
  <section id="setup" class="setup hidden">
    <div class="setup-card">
      <h1>CodexApp</h1>
      <p class="muted">远程控制电脑上的 Codex</p>

      <div class="tabs">
        <button id="tabCloud" class="tab">云账号</button>
        <button id="tabLan" class="tab on">中继直连</button>
      </div>

      <!-- Cloud (account) mode -->
      <div id="cloudForm" class="hidden">
        <label>邮箱</label>
        <input id="cEmail" type="email" placeholder="you@example.com" autocapitalize="off" autocorrect="off" />
        <label>密码</label>
        <input id="cPass" type="password" placeholder="至少 8 位" />
        <button id="cLogin" class="btn primary big">登录</button>
        <button id="cRegister" class="btn secondary full">注册新账号</button>
        <button id="cResend" class="btn ghost full hidden">重新发送验证邮件</button>
        <button id="cForgot" class="btn ghost full">忘记密码？</button>
        <p id="cMsg" class="muted small" role="status"></p>
      </div>

      <!-- LAN direct mode -->
      <div id="lanForm">
        <label>中继地址</label>
        <input id="setupUrl" type="url" inputmode="url" placeholder="https://my-pc.tail123456.ts.net" />
        <button id="usePageUrl" class="btn ghost full hidden">使用当前页面地址</button>
        <label>访问 Token</label>
        <input id="setupToken" type="text" placeholder="粘贴电脑终端显示的 Token" autocapitalize="off" autocorrect="off" />
        <button id="setupSave" class="btn primary big">连接</button>
        <p id="setupMsg" class="muted small" role="status"></p>
      </div>
    </div>
  </section>

  <!-- Register (separate screen) -->
  <section id="register" class="setup hidden">
    <div class="setup-card">
      <h1>注册新账号</h1>
      <p class="muted">注册后会收到验证邮件，点链接验证再登录。</p>
      <label>邮箱</label>
      <input id="rEmail" type="email" placeholder="you@example.com" autocapitalize="off" autocorrect="off" />
      <label>密码</label>
      <input id="rPass" type="password" placeholder="至少 8 位" />
      <label>确认密码</label>
      <input id="rPass2" type="password" placeholder="再输入一次" />
      <button id="rSubmit" class="btn primary big">注册</button>
      <button id="rResend" class="btn ghost full hidden">重新发送验证邮件</button>
      <button id="rBack" class="btn ghost full">返回登录</button>
      <p id="rMsg" class="muted small"></p>
    </div>
  </section>

  <!-- Pairing (shown after login, only when an agent needs pairing) -->
  <section id="pairing" class="setup hidden">
    <div class="setup-card">
      <h1>配对电脑端</h1>
      <p class="muted">把这台设备和你的电脑绑定一次，之后会自动连，不用再输。</p>
      <p id="pStatus" class="muted small"></p>
      <label>配对码</label>
      <input id="pCode" type="text" placeholder="例 FVBRQU" autocapitalize="characters" autocorrect="off" />
      <button id="pSubmit" class="btn primary big">配对</button>
      <p id="pMsg" class="muted small">在电脑客户端「控制面板」(或终端)能看到 6 位配对码，输入它即可。</p>
      <button id="pLogout" class="btn ghost full">退出登录</button>
    </div>
  </section>

  <!-- Membership gate (cloud only; LAN is free) -->
  <section id="membership" class="setup hidden">
    <div class="setup-card">
      <h1>开通云端会员</h1>
      <p class="muted">局域网直连模式永久免费；云端（随处可用）需要会员。</p>
      <p id="mStatus" class="muted small"></p>
      <label>兑换码</label>
      <input id="mCode" type="text" placeholder="CDX-XXXX-XXXX-XXXX" autocapitalize="characters" autocorrect="off" />
      <button id="mRedeem" class="btn primary big">兑换并开通</button>
      <p id="mMsg" class="muted small"></p>
      <button id="mLan" class="btn secondary full">改用局域网模式（免费）</button>
      <button id="mClose" class="btn ghost full">返回</button>
    </div>
  </section>

  <!-- Main app -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="sessionsBtn" class="icon-btn mobile-menu" aria-label="打开会话列表" title="会话列表"><i data-lucide="menu"></i></button>
      <button id="modelBtn" class="model-trigger" aria-label="选择模型与思考等级" title="模型与思考等级"><strong>CodexApp</strong><span id="headerModel">默认模型</span><i data-lucide="chevron-down"></i></button>
      <div class="topinfo"><span id="connDot" class="dot" title="连接状态"></span><span id="statusPill" class="pill idle" role="status">连接中</span></div>
      <button id="reconnectBtn" class="icon-btn" aria-label="重新连接" title="重新连接"><i data-lucide="refresh-cw"></i></button>
      <button id="quickNewThread" class="icon-btn" aria-label="新建会话" title="新建会话"><i data-lucide="square-pen"></i></button>
      <button id="menuBtn" class="icon-btn" aria-label="设置" title="设置"><i data-lucide="ellipsis"></i></button>
    </header>
    <div class="subbar">
      <span id="threadTitle">新对话</span><span id="cwdLabel" class="muted small mono"></span>
    </div>

    <div class="conversation">
      <div id="historyToolbar" class="history-toolbar hidden">
        <button id="historyOlder" class="icon-btn hidden" title="更早的消息" aria-label="更早的消息"><i data-lucide="chevron-up"></i></button>
        <span id="historyStatus" role="status"></span>
        <button id="historyNewer" class="icon-btn hidden" title="较新的消息" aria-label="较新的消息"><i data-lucide="chevron-down"></i></button>
      </div>
      <div id="emptyState" class="empty-state"><img src="icon-180.png" alt="" width="48" height="48" /><h1>有什么可以帮忙的？</h1></div>
      <main id="feed" class="feed" aria-label="对话内容"></main>
      <button id="scrollBottom" class="icon-btn scroll-bottom hidden" aria-label="回到最新消息" title="回到最新消息"><i data-lucide="arrow-down"></i></button>
    </div>

    <div id="approvals" class="approvals"></div>

    <button id="diffBar" class="diff-bar hidden"><i data-lucide="file-diff"></i>查看本次改动</button>

    <footer class="composer">
      <div id="runningBar" class="running-bar hidden">
        <span class="muted small"><span class="working-dot"></span>正在处理</span>
        <button id="interruptBtn" class="icon-btn stop-btn" aria-label="停止当前任务" title="停止当前任务"><i data-lucide="square"></i></button>
      </div>
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="发送消息" aria-label="消息"></textarea>
        <div class="composer-tools">
          <button id="effortBtn" class="effort-trigger" title="选择思考等级"><i data-lucide="sliders-horizontal"></i><span id="effortLabel">默认思考</span></button>
          <label class="steer-toggle" title="向正在运行的任务补充指令"><input type="checkbox" id="steerMode" role="switch" />纠偏</label>
          <button id="sendBtn" class="icon-btn send-btn" aria-label="发送消息" title="发送消息"><i data-lucide="arrow-up"></i></button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Settings sheet -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-header"><h2 id="settingsTitle">设置</h2><button id="sheetClose" class="icon-btn" aria-label="关闭设置" title="关闭"><i data-lucide="x"></i></button></div>
      <label>工作目录 (cwd)</label>
      <input id="cfgCwd" type="text" class="mono" autocapitalize="off" autocorrect="off" />
      <label for="cfgModel">模型</label>
      <div class="model-row">
        <select id="cfgModel" aria-label="模型">
          <option value="default">Codex 默认</option>
          <option value="custom">自定义模型</option>
        </select>
        <button id="modelsRefresh" class="icon-btn" title="刷新模型列表" aria-label="刷新模型列表"><i data-lucide="refresh-cw"></i></button>
      </div>
      <div id="customModelRow" class="hidden">
        <label for="cfgCustomModel">模型 ID</label>
        <input id="cfgCustomModel" class="mono" type="text" maxlength="200" autocapitalize="off" autocorrect="off" spellcheck="false" />
      </div>
      <p id="modelsStatus" class="muted small" role="status" aria-live="polite"></p>
      <label for="cfgEffort">思考等级</label>
      <select id="cfgEffort" aria-label="思考等级"><option value="">Codex 默认</option></select>
      <div id="customEffortRow" class="hidden"><label for="cfgCustomEffort">自定义思考等级</label><input id="cfgCustomEffort" type="text" maxlength="64" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例如 high" /></div>
      <label for="cfgTheme">外观</label><select id="cfgTheme"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select>
      <label>审批策略</label>
      <select id="cfgApproval">
        <option value="on-request">on-request（按需，推荐）</option>
        <option value="untrusted">untrusted（几乎每条都问）</option>
        <option value="on-failure">on-failure（失败才问）</option>
        <option value="never">never（不审批）</option>
      </select>
      <label>沙箱</label>
      <select id="cfgSandbox">
        <option value="workspace-write">workspace-write</option>
        <option value="read-only">read-only</option>
        <option value="danger-full-access">danger-full-access</option>
      </select>
      <div class="sheet-actions">
        <button id="cfgApply" class="btn primary">应用</button>
        <button id="newThreadBtn" class="btn secondary">新建会话</button>
      </div>
      <p id="cfgError" class="small settings-error hidden" role="alert"></p>
      <button id="enableNotif" class="btn secondary full">开启审批通知</button>
      <p id="memberStatus" class="muted small"></p>
      <button id="redeemBtn" class="btn secondary full hidden">兑换 / 续费会员</button>
      <button id="forget" class="btn ghost full">退出/忘记连接</button>
    </div>
  </div>

  <!-- Sessions / projects sheet -->
  <div id="sessionsSheet" class="sheet sessions-sheet hidden">
    <aside class="sidebar" aria-label="会话与项目">
      <div class="sheet-header"><strong>CodexApp</strong><button id="sessionsRefresh" class="icon-btn" aria-label="刷新会话列表" title="刷新会话列表"><i data-lucide="refresh-cw"></i></button><button id="sessionsClose" class="icon-btn mobile-menu" aria-label="关闭会话列表" title="关闭"><i data-lucide="x"></i></button></div>
      <button id="sidebarNewThread" class="sidebar-command"><i data-lucide="square-pen"></i>新对话</button>
      <label class="session-search"><i data-lucide="search"></i><input id="sessionSearch" type="search" placeholder="搜索对话" aria-label="搜索对话" /></label>
      <div id="sessionsList" class="sessions-list"><p class="muted small">等待连接</p></div>
      <button id="sidebarSettings" class="sidebar-command sidebar-settings"><i data-lucide="settings-2"></i>设置</button>
    </aside>
    </div>
  </div>

  <div id="writerSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="writerTitle">
    <div class="sheet-card">
      <h2 id="writerTitle">会话被占用</h2>
      <p id="writerMessage" class="small"></p>
      <div id="writerOwners"></div>
      <div id="writerConfirm" class="hidden">
        <p id="writerConfirmText" class="settings-error small"></p>
        <div class="sheet-actions">
          <button id="writerConfirmBtn" class="btn danger">确认结束进程</button>
          <button id="writerCancelBtn" class="btn secondary">取消</button>
        </div>
      </div>
      <p id="writerStatus" class="small muted" role="status" aria-live="polite"></p>
      <div class="sheet-actions">
        <button id="writerRetry" class="btn secondary">重试接续</button>
        <button id="writerInspect" class="btn secondary">重新检查占用</button>
      </div>
      <button id="writerClose" class="btn ghost full">关闭</button>
    </div>
  </div>

  <!-- Diff sheet -->
  <div id="diffSheet" class="sheet hidden">
    <div class="sheet-card">
      <h2>本次改动 (diff)</h2>
      <pre id="diffContent" class="diff"></pre>
      <button id="diffClose" class="btn ghost full">关闭</button>
    </div>
  </div>

  <script src="vendor/nacl.js"></script>
  <script src="e2e.js"></script>
  <script src="vendor/chat-ui.js"></script>
  <script src="history-feed.js"></script>
  <script src="app.js"></script>
</body>
</html>
